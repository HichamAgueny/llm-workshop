# Model arguments
model:
  # Use the LoRA-enabled model component because LoRA weights are separate from the base model.
  _component_: torchtune.models.llama3_2.lora_llama3_2_1b

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  # Directory containing the saved LoRA adapter weights (not merged into base model)
  checkpoint_dir: /cluster/projects/nn9997k/hicham/llm-workshop/data/Llama-3.2-1B-Instruct_out_onlyLoRAweight/
  checkpoint_files: [
    adapter_0.pt
  ]
  output_dir: /cluster/projects/nn9997k/hicham/llm-workshop/data/Inference_results/Llama-3.2-1B-Instruct_inference_out/
  model_type: LLAMA3
  # Path to the base pre-trained model (required for LoRA inference)
  base_model_path: /cluster/projects/nn9997k/hicham/llm-workshop/data/Llama-3.2-1B-Instruct/

device: cuda
dtype: bf16

seed: 1234

# Tokenizer arguments
tokenizer:
  _component_: torchtune.models.llama3.llama3_tokenizer
  path: /cluster/projects/nn9997k/hicham/llm-workshop/data/Llama-3.2-1B-Instruct/original/tokenizer.model

# Generation arguments; defaults taken from gpt-fast
prompt:
  system: null
  user: |
    --Explain the importance of High Performance Computing in modern research in a concise way.

    --Output:
instruct_template: null
chat_format: null
max_new_tokens: 500
temperature: 0.6
top_k: 300

enable_kv_cache: True

quantizer: null

